<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;font:13px system-ui,sans-serif;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#222)}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5;color:var(--figma-color-text-secondary,#666)}label{display:grid;gap:8px;margin:20px 0 12px}input{font:18px system-ui;letter-spacing:3px;padding:10px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box;background:var(--figma-color-bg);color:inherit}button{padding:10px 14px;border:0;border-radius:8px;font:13px system-ui;cursor:pointer;background:#e8d92f;color:#222}button:disabled{opacity:.5;cursor:default}#disconnect{background:var(--figma-color-bg-secondary,#eee);color:inherit;margin-left:8px}#status{font-weight:600;margin-top:20px}#file{overflow-wrap:anywhere;font-size:12px}small{line-height:1.5;display:block;color:var(--figma-color-text-secondary,#666);margin-top:16px}
</style></head><body>
<h1>Wendler Local</h1><p>Conecte este arquivo ao seu agente, pela ponte no computador.</p>
<form id="connect"><label>Código mostrado no Wendler<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off" placeholder="000000"></label><button id="connect-button">Conectar arquivo</button><button id="disconnect" type="button" hidden>Desconectar</button></form>
<div id="status" role="status">Aguardando conexão</div><p id="file"></p><small>Mantenha este plugin aberto. Você pode desfazer edições no Figma. Esta ponte não utiliza o MCP oficial nem a API REST.</small>
<script>
const BASE='http://localhost:5174/api/figma-local';const instanceId=typeof crypto.randomUUID==='function'?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');let token='',documentInfo=null,running=false,timer,busy=false,generation=0;
const status=document.getElementById('status'),file=document.getElementById('file'),disconnect=document.getElementById('disconnect');
// Figma Desktop wraps development UIs in an opaque-origin frame. Only the
// immediate parent receives this message; incoming messages are source-checked.
const tell=pluginMessage=>parent.postMessage({pluginMessage},'*');
async function request(route,body,credential=token){const response=await fetch(BASE+'/plugin/'+route,{method:'POST',headers:{'Content-Type':'application/json',...(credential?{Authorization:'Bearer '+credential}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(10000)});const value=await response.json();if(!response.ok)throw Error(value.error||'A ponte não respondeu.');return value}
async function stop(){generation++;running=false;clearTimeout(timer);try{if(token)await request('disconnect',{instanceId})}catch{}token='';tell({type:'credentials',token:''});disconnect.hidden=true;status.textContent='Desconectado';document.getElementById('connect-button').disabled=false}
async function poll(){if(!running||busy)return;const current=generation;try{tell({type:'snapshot'});if(!documentInfo)throw Error('Aguardando o arquivo do Figma.');const value=await request('poll',{instanceId,document:documentInfo});if(current!==generation)return;status.textContent=busy?'Executando pedido do agente':'Arquivo conectado';file.textContent=documentInfo.name+' · '+documentInfo.page;if(value.command){busy=true;status.textContent='Executando pedido do agente';tell({type:'command',command:value.command});return}}catch(error){if(current!==generation)return;status.textContent=error.message;if(/Reconecte/.test(error.message)){running=false;token='';tell({type:'credentials',token:''});document.getElementById('connect-button').disabled=false;return}}if(running&&current===generation)timer=setTimeout(poll,750)}
function start(){generation++;running=true;disconnect.hidden=false;document.getElementById('connect-button').disabled=true;clearTimeout(timer);void poll()}
document.getElementById('connect').onsubmit=async event=>{event.preventDefault();try{const result=await request('pair',{code:document.getElementById('code').value},'');token=result.token;tell({type:'credentials',token});document.getElementById('code').value='';start()}catch(error){status.textContent=error.message}};
disconnect.onclick=()=>void stop();
window.onmessage=event=>{if(event.source!==parent&&event.origin!=='https://www.figma.com')return;const message=event.data?.pluginMessage;if(!message||typeof message!=='object')return;if(message.type==='snapshot-error'){running=false;clearTimeout(timer);status.textContent=message.error}else if(message.type==='document')documentInfo=message.document;else if(message.type==='credentials'){token=message.token;if(token)start()}else if(message.type==='result'){const current=generation;void request('result',{instanceId,id:message.id,...(message.error?{error:message.error}:{result:message.result})}).catch(error=>{status.textContent=error.message}).finally(()=>{busy=false;if(running&&current===generation)timer=setTimeout(poll,100)})}};
setInterval(()=>{if(running&&busy&&documentInfo)void request('poll',{instanceId,document:documentInfo,busy:true}).catch(()=>{})},2000);
tell({type:'ready'});
</script></body></html>
